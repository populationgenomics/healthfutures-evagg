# Uncached pipeline version, writing JSON output.

log:
  di_factory: lib.evagg.utils.init_logger
  level: INFO
  to_file: true

env_config:
  di_factory: lib.evagg.utils.get_env_settings
  filter_prefix: "LITELLM_"

llm_client:
  di_factory: lib.evagg.llm.LiteLLMClient
  config: "{{env_config}}"

# Application.
di_factory: lib.evagg.PaperQueryApp
queries:
  di_factory: lib/config/queries/genes.yaml
library:
  di_factory: lib.evagg.RareDiseaseFileLibrary
  paper_client:
    di_factory: lib/config/objects/ncbi.yaml
  llm_client: "{{llm_client}}"
  allowed_categories:
    - "genetic disease"
extractor:
  di_factory: lib.evagg.PromptBasedContentExtractor
  fields:
    di_factory: lib/config/fields/evidence_all.yaml
  llm_client:
    di_factory: lib.evagg.llm.LiteLLMCacheClient
    config: "{{env_config}}"
  phenotype_searcher:
    di_factory: lib.evagg.ref.WebHPOClient
    web_client:
      di_factory: lib/config/objects/web.yaml
  phenotype_fetcher:
    di_factory: lib.evagg.ref.PyHPOClient    
  observation_finder:
    di_factory: lib.evagg.content.ObservationFinder
    llm_client: "{{llm_client}}"
    variant_factory: 
      di_factory: lib/config/objects/variant_factory.yaml
    variant_comparator: 
      di_factory: lib.evagg.content.HGVSVariantComparator
writer:
  di_factory: lib.evagg.JSONOutputWriter
  json_name: /app/.out/evagg_results.json
  env_config: "{{env_config}}"
